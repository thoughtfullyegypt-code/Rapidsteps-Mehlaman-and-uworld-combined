      <rect x="0" y="78" width="342" height="66" rx="12" fill="#020617" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="102" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748B">02 · LAB SIGNATURE</text>
      <text x="16" y="126" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">RBC casts + dysmorphic RBCs (Nephritic)</text>

      {/* Step 3 */}
      <rect x="0" y="156" width="342" height="66" rx="12" fill="#020617" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="180" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748B">03 · PATHOLOGY BUZZWORD</text>
      <text x="16" y="204" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FBBF24">Subepithelial humps on EM · Low C3</text>

