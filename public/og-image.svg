    <g transform="translate(24, 66)">
      {/* Step 1 */}
      <rect x="0" y="0" width="342" height="66" rx="12" fill="#020617" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748B">01 · PRESENTATION</text>
      <text x="16" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Cola-colored urine + periorbital edema</text>

