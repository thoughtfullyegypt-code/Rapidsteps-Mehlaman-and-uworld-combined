      <rect x="0" y="234" width="342" height="90" rx="14" fill="#1E2A8A" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" />
      <text x="16" y="260" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#93C5FD">04 · LOCKED DIAGNOSIS</text>
      <text x="16" y="288" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Post-streptococcal GN (PSGN)</text>
      <text x="16" y="308" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">2–4 weeks post-pharyngitis / impetigo · Supportive care</text>
