  <text x="96" y="365" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FF8C1A" letter-spacing="-1">actually ask it.</text>

  {/* Subline */}
  <text x="96" y="425" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">USMLE Step 1 buzzword atlas: map, drill, decoder, 5-step frameworks</text>

  {/* Stats Chips Row */}
  <g transform="translate(96, 480)">
    {/* Chip 1 */}
    <rect x="0" y="0" width="135" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
