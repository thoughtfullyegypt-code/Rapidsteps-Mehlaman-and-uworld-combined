# Deploy the static Vite build to GitHub Pages.
#
# Triggers on pushes to main (and manually via workflow_dispatch).
# Runs typecheck + build, copies index.html to 404.html so SPA deep links
# (e.g. /app/#psgn, /pricing) resolve on Pages, then deploys dist/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build
        env:
          # Serve from the project sub-path so assets, routes, and data
          # fetches resolve on GitHub Pages.
          PAGES_BASE: /Rapidsteps-Mehlaman-and-uworld-combined/

      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
